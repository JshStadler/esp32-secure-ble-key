[platformio]
src_dir = main

[env:esp32c3]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = espidf
board_build.partitions = partitions_ota.csv
extra_scripts = post:sign_firmware.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Use our sdkconfig.defaults for PM, NimBLE, etc.
; PlatformIO merges this into the generated sdkconfig.

; For debug builds: uncomment this and re-enable the USB Serial/JTAG controller,
; USB console, and logging settings described in BUILD_NOTES.md.
; build_flags = -DDEBUG
