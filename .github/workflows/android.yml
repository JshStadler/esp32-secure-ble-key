name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Native_Android_Application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            Native_Android_Application/app/build/reports/tests/
            Native_Android_Application/app/build/reports/lint-results-debug.html

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Native_Android_Application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        shell: bash
        run: printf '%s' "$CAR_KEY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/car-key-release.jks"
        env:
          CAR_KEY_KEYSTORE_BASE64: ${{ secrets.CAR_KEY_KEYSTORE_BASE64 }}
      - name: Build signed release APK
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
        env:
          CAR_KEY_KEYSTORE_PATH: ${{ runner.temp }}/car-key-release.jks
          CAR_KEY_STORE_PASSWORD: ${{ secrets.CAR_KEY_STORE_PASSWORD }}
          CAR_KEY_KEY_ALIAS: ${{ secrets.CAR_KEY_KEY_ALIAS }}
          CAR_KEY_KEY_PASSWORD: ${{ secrets.CAR_KEY_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Car-Key-${{ github.ref_name }}
          path: Native_Android_Application/app/build/outputs/apk/release/app-release.apk
