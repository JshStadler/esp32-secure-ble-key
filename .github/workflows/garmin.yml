name: Garmin signed release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  signed-watch:
    # Ephemeral trusted runner with the licensed Garmin SDK/devices installed.
    # Never use this runner for pull requests or untrusted branches.
    if: github.repository == 'JshStadler/esp32-secure-ble-key' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, Windows, X64, blekey-garmin-release]
    steps:
      - uses: actions/checkout@v7
      - name: Build all supported watches with the repository signing key
        shell: powershell
        env:
          GARMIN_DEVELOPER_KEY_BASE64: ${{ secrets.GARMIN_DEVELOPER_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (Get-Content "$env:APPDATA/Garmin/ConnectIQ/current-sdk.cfg").Trim()
          $java = 'C:/dev/jdk-17/bin/java.exe'
          $key = Join-Path $env:RUNNER_TEMP 'garmin-release.der'
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GARMIN_DEVELOPER_KEY_BASE64))
            New-Item -ItemType Directory -Force release | Out-Null
            foreach ($kind in @('Car', 'Gate')) {
              $project = if ($kind -eq 'Car') { 'Garmin_Watch_App' } else { 'Garmin_Gate_Watch_App' }
              foreach ($device in @('fr165', 'fr165m', 'fr265', 'fr265s', 'fr965')) {
                & $java '-Xms256m' '-Dfile.encoding=UTF-8' -cp "$sdk/bin/monkeybrains.jar" com.garmin.monkeybrains.Monkeybrains -f "$project/monkey.jungle" -d $device -o "release/BLE-$kind-Key-$device.prg" -y $key -r -w
                if ($LASTEXITCODE -ne 0) { throw "Build failed: $kind $device" }
              }
              & $java '-Xms256m' '-Dfile.encoding=UTF-8' -cp "$sdk/bin/monkeybrains.jar" com.garmin.monkeybrains.Monkeybrains -f "$project/monkey.jungle" -e -o "release/BLE-$kind-Key.iq" -y $key -r -w
              if ($LASTEXITCODE -ne 0) { throw "Package failed: $kind" }
            }
          } finally { Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v7
        with:
          name: Garmin-signed-release
          path: |
            release/*.prg
            release/*.iq
          if-no-files-found: error
