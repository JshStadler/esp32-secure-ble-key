name: Garmin signed release
on:
  workflow_dispatch:
    inputs:
      input_release:
        description: Draft release containing garmin-build-inputs.zip
        required: true
      input_sha256:
        description: Reviewed SHA256 of garmin-build-inputs.zip
        required: true
permissions:
  contents: read
jobs:
  signed-watch:
    # GitHub requires write access even to read an unpublished draft release.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Garmin SDK signing tools
        run: |
          curl --fail --location --retry 3 https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-9.1.0-2026-03-09-6a872a80b.zip -o "$RUNNER_TEMP/sdk.zip"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/garmin-sdk"
      - name: Fetch reviewed compiler output
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.input_release }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          gh release download "$INPUT_RELEASE" --pattern garmin-build-inputs.zip --dir "$RUNNER_TEMP"
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/garmin-build-inputs.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/garmin-build-inputs.zip" -d "$RUNNER_TEMP/garmin-input"
      - name: Re-sign and verify both watch packages with repository secret
        env:
          GARMIN_DEVELOPER_KEY_BASE64: ${{ secrets.GARMIN_DEVELOPER_KEY_BASE64 }}
        run: |
          key="$RUNNER_TEMP/garmin-release.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$GARMIN_DEVELOPER_KEY_BASE64" | base64 --decode > "$key"
          jar=$(find "$RUNNER_TEMP/garmin-sdk" -name monkeybrains.jar -print -quit)
          for kind in Car Gate; do
            java -cp "$jar" tools/SignGarmin.java "$key" "$RUNNER_TEMP/garmin-input/BLE-$kind-Key.iq" release
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Garmin-signed-release
          path: |
            release/*.prg
            release/*.iq
          if-no-files-found: error
